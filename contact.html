<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Seth Kolodny</title>
<meta name="description" content="How to get in touch with Seth Kolodny.">
<link rel="canonical" href="https://sethkolodny.com/contact.html">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Georgia,serif'>S</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Seth Kolodny</a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="index.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">

    <h1>Contact</h1>

    <ul class="contact-list">
      <li>
        <span class="label">Email</span>
        <!-- The address is assembled by the script at the bottom of this
             page, so scrapers reading the raw HTML never see it whole.
             People with JavaScript off still get the readable version. -->
        <span id="email-slot"><noscript>sethkolodny [at] gmail [dot] com</noscript></span>
      </li>
      <li>
        <span class="label">LinkedIn</span>
        <a href="https://www.linkedin.com/in/sethkolodny/">linkedin.com/in/sethkolodny</a>
      </li>
    </ul>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; <span id="year">2026</span> Seth Kolodny</p>
    <p><a href="index.html">About</a></p>
  </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

/* Builds the email address from pieces at page load. A spam bot reading
   the raw HTML finds no address; a real visitor gets a working link. */
(function () {
  var user = "sethkolodny";
  var host = "gmail" + "." + "com";
  var slot = document.getElementById("email-slot");
  if (!slot) return;
  var link = document.createElement("a");
  link.href = "mail" + "to:" + user + String.fromCharCode(64) + host;
  link.textContent = user + String.fromCharCode(64) + host;
  slot.textContent = "";
  slot.appendChild(link);
}());
</script>

</body>
</html>
